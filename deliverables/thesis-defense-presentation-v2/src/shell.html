<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1220">
<title>{{meta.title}}</title>
<link rel="stylesheet" href="assets/vendor/katex/katex.min.css">
<link rel="stylesheet" href="assets/css/deck.css">
<link rel="stylesheet" href="assets/css/slides.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
<!--SLIDES-->
    <div id="chrome">
      <nav id="partnav"></nav>
      <div id="footer">
        <div class="who"><img src="assets/img/kntu-logo.png" alt=""><span>{{meta.author}}</span></div>
        <div id="counter"></div>
      </div>
      <div id="progress"><i></i></div>
    </div>
  </div>
</div>

<div id="presenter">
  <div class="bar">
    <span class="where"><b id="pv-count"></b><span id="pv-part"></span></span>
    <span id="pv-conn" class="conn"></span>
    <span class="timer"><span class="tl">{{ui.timer}}: </span><span class="clock" id="pv-clock">00:00</span> <button id="pv-reset">{{ui.reset}}</button><button id="pv-pen" type="button" aria-pressed="false" aria-label="{{ui.pen}}" title="{{ui.pen}}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-4.6L16.6 4a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8 4 20z"/><path d="M14.5 6.1l3.4 3.4"/></svg></button><button id="pv-fs" type="button" aria-label="{{ui.fullscreen}}" title="{{ui.fullscreen}}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button></span>
  </div>
  <div class="previews">
    <div class="pv cur"><label>{{ui.current}}</label><iframe title="current" tabindex="-1"></iframe></div>
    <div id="pv-video" hidden>
      <input type="range" id="pv-vseek" min="0" max="1000" value="0" tabindex="-1" aria-label="{{ui.play}}">
      <span id="pv-vtime"></span>
      <button data-v="restart" tabindex="-1">{{ui.v_restart}} <kbd>R</kbd></button>
      <button data-v="back" tabindex="-1">{{ui.v_back}} <kbd>J</kbd></button>
      <button data-v="toggle" class="main" tabindex="-1"><span class="if-paused">{{ui.v_play}}</span><span class="if-playing">{{ui.v_pause}}</span> <kbd>K</kbd></button>
      <button data-v="fwd" tabindex="-1">{{ui.v_fwd}} <kbd>L</kbd></button>
      <button data-v="mute" tabindex="-1"><span class="if-muted">{{ui.v_unmute}}</span><span class="if-sound">{{ui.v_mute}}</span> <kbd>M</kbd></button>
    </div>
    <div class="pv next"><label>{{ui.next}}</label><iframe title="next" tabindex="-1"></iframe><div class="ncap"><span class="go">{{ui.nextbtn}}<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></span><b id="pv-ntitle"></b></div></div>
    <nav id="pv-remote">
      <button id="pv-prev" type="button"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>{{ui.prev}}</button>
      <button id="pv-list" type="button"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h14"/></svg>{{ui.slides}}</button>
    </nav>
  </div>
  <div class="notesbox">
    <div class="nb-head"><h4>{{ui.notes}}</h4><span class="nb-tools"><span class="ed-tools"><span id="pv-edmsg"></span><button id="pv-cancel" type="button" tabindex="-1">{{ui.cancel}}</button><button id="pv-save" type="button" tabindex="-1">{{ui.save}}</button><button id="pv-edit" type="button" tabindex="-1">{{ui.edit}}</button></span><span class="fsz" role="group" aria-label="{{ui.font}}"><button type="button" data-fsz="-1" aria-label="−">A−</button><button type="button" data-fsz="1" aria-label="+">A+</button></span><button id="pv-sum" type="button" tabindex="-1" aria-pressed="false"><i></i>{{ui.sum}}</button></span></div>
    <h3 id="pv-title"></h3>
    <div id="pv-notes"></div>
    <textarea id="pv-editor" dir="rtl" spellcheck="false" hidden></textarea>
  </div>
  <div id="pv-pentoast"></div>
  <div class="hint">{{ui.help}}</div>
</div>

<div id="overview"><ol></ol></div>
<div id="help">{{ui.help}}</div>

<script type="application/json" id="deck-config">{{CONFIG}}</script>
<script src="assets/vendor/katex/katex.min.js"></script>
<script src="assets/js/deck.js"></script>
</body>
</html>
